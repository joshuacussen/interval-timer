<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interval Timer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text font-size='90'>⏱️</text></svg>">
</head>
<body>

  <div class="overlay" id="overlay" onclick="closePanel()"></div>

  <div class="panel" id="panel">
    <h2>Intervals</h2>
    <div id="interval-list"></div>
    <button class="add-btn" onclick="addInterval()">+ Add interval</button>
    <hr class="panel-divider">
    <button class="apply-btn" onclick="applySettings()">Apply &amp; reset</button>
    <p class="panel-note">Changes reset the timer to the start of the first interval.</p>
  </div>

  <button class="settings-btn" id="settings-btn" onclick="togglePanel()" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <div class="card">
    <div class="carousel-wrap">
      <div class="carousel-track" id="carousel-track"></div>
    </div>
    <div class="clock-wrap">
      <svg class="ring" width="220" height="220">
        <circle cx="110" cy="110" r="98" fill="none" stroke="#eeeeee" stroke-width="10"/>
        <circle id="progress" cx="110" cy="110" r="98" fill="none"
          stroke="#1a56c4" stroke-width="10"
          stroke-dasharray="615.75" stroke-dashoffset="0"
          stroke-linecap="round"
          style="transition: stroke-dashoffset 0.6s linear, stroke 0.5s;"/>
      </svg>
      <div class="time-display">
        <div class="time-number" id="time-display">--:--</div>
        <div class="time-label" id="phase-label"></div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl primary" id="start-btn" onclick="toggleTimer()">
        <svg class="icon" id="btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span id="btn-label">Start</span>
      </button>
      <button class="ctrl" onclick="resetTimer()">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>
        Reset
      </button>
      <button class="ctrl" onclick="skipPhase()">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
        Skip
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
